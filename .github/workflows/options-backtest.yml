name: Options strategy replay

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-auuwho]
    paths: ["options/backtest_spy.py", ".github/workflows/options-backtest.yml"]

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r options/requirements.txt
      - run: python options/backtest_spy.py
