name: Options strategy replay

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers to compare (empty = detailed SPY report)"
        type: string
        default: ""

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r options/requirements.txt
      - run: python options/backtest_spy.py
        env:
          TICKERS: ${{ inputs.tickers }}
