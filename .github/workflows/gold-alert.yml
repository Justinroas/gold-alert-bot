name: Gold alert

on:
  schedule:
    # Every 10 min (2 min after each 30-min candle close, plus entry-trigger checks
    # in between). Covers 3am-4pm New York in both EDT and EST; the script itself
    # enforces the window. Every 10 min keeps this inside GitHub's free minutes.
    - cron: "2-59/10 7-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_message:
        description: "Send a test message even if there is no breakout"
        type: boolean
        default: false
      force_news:
        description: "Send news now: brief, headlines or all"
        type: string
        default: ""

concurrency: gold-alert

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Remember last alert (avoids double alerts)
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: gold-state-${{ github.run_id }}
          restore-keys: gold-state-
      - run: python alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FORCE_MESSAGE: ${{ inputs.force_message }}
          FORCE_NEWS: ${{ inputs.force_news }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: gold-state-${{ github.run_id }}
